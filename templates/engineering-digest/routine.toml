[routine]
name = "engineering-digest"
type = "watch"
schedule = "0 21 * * 0-4"  # UTC, Sunday to Thursday; minimum interval is 1 hour
first_run = "report-only"

[store]
adapter = "artifact-db"

[workspace]
enabled = true
template = "engineering-digest"
template_version = 1

[[setting]]
name = "repositories"
type = "list"
role = "include"
label = "Repositories"
example = "your-org/your-repo"
default = []
cost_note = "each repository adds reads per run"

[[setting]]
name = "stale_after_days"
type = "number"
label = "Stale after (days)"
default = 7
min = 1
max = 60
cost_note = "no extra cost; a lower value means more stale flags"

[[setting]]
name = "include_drafts"
type = "toggle"
label = "Include draft pull requests"
default = false
cost_note = "more items to read"

[[setting]]
name = "max_inbox_per_run"
type = "number"
label = "Inbox messages per run"
default = 5
min = 0
max = 20
cost_note = "no extra cost; more messages ask more of your attention"

[gate]
enabled = false
