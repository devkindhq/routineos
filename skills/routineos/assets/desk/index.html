<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoutineOS Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* src/tokens.css */
/* Desk tokens. The v2 palette from the Desk design draft (docs/superpowers/specs/assets/2026-10-30-desk-design-draft.html),
   with --muted and light --warn darkened to keep 4.5:1 text contrast. --line is for dividers only; control borders use
   --muted (3:1 for non-text). */
:root {
  --bg: #FFFFFF;  --surface: #F8F8FA;  --line: #EBECF0;
  --ink: #15171C; --muted: #696E7B;
  --accent: #2F5BD8; --accent-ink: #FFFFFF; --accent-soft: #EAF0FD;
  --ok: #1F7A46;   --ok-bg: #E3F4E8;
  --warn: #9C540A; --warn-bg: #FDEEDC;
  --fail: #B13A33; --fail-bg: #FBE8E6;
  --pur: #6A42B5; --pur-bg: #F1ECFA;
  --sel: #EFF0F4; --btn: #111216; --btn-ink: #FFFFFF;
  --scrim: rgba(21, 23, 28, 0.32);
  --font-sans: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-16: 64px;
  --radius-1: 4px; --radius-2: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171C;  --surface: #1A1D23;  --line: #262A32;
    --ink: #E9EBF0; --muted: #8B91A0;
    --accent: #86A3F7; --accent-ink: #15171C; --accent-soft: #1E2638;
    --ok: #66C98F;   --ok-bg: #17301F;
    --warn: #E8A85A; --warn-bg: #382B17;
    --fail: #EE8479; --fail-bg: #3A1F1C;
    --pur: #B497EE; --pur-bg: #2A2238;
    --sel: #232731; --btn: #F1F2F5; --btn-ink: #15171C;
    --scrim: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171C;  --surface: #1A1D23;  --line: #262A32;
  --ink: #E9EBF0; --muted: #8B91A0;
  --accent: #86A3F7; --accent-ink: #15171C; --accent-soft: #1E2638;
  --ok: #66C98F;   --ok-bg: #17301F;
  --warn: #E8A85A; --warn-bg: #382B17;
  --fail: #EE8479; --fail-bg: #3A1F1C;
  --pur: #B497EE; --pur-bg: #2A2238;
  --sel: #232731; --btn: #F1F2F5; --btn-ink: #15171C;
  --scrim: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

/* src/shell.css */
/* Desk shell. Phone first; the sidebar replaces the bottom nav at 900px and wider (a drawer under it). */
:root { --nav-h: 56px; --top-h: 56px; --side-w: 240px; --side-slim: 64px; --notif-w: 360px; --gutter: var(--space-4); }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-sans); font-size: 16px; line-height: 1.5;
  overflow-wrap: break-word;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
}
a { color: var(--accent); text-underline-offset: 0.2em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); }
.mono, .num, td, th, time, .count { font-variant-numeric: tabular-nums; }
h1, h2, h3 { line-height: 1.25; margin: 0 0 var(--space-3); letter-spacing: -0.01em; }
h1 { font-size: 1.25rem; font-weight: 600; }
h2 { font-size: 1rem; font-weight: 600; }
p { margin: 0 0 var(--space-3); }
.muted { color: var(--muted); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.kbd {
  display: inline-block; min-width: 18px; height: 18px; padding: 0 5px; line-height: 16px; text-align: center;
  font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap;
  background: var(--bg); border: 1px solid var(--line); border-radius: 5px;
}

/* app: sidebar plus pane */
.app { min-width: 0; }
.pane { min-width: 0; display: flex; flex-direction: column; }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 3;
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2);
  min-height: var(--top-h); padding: var(--space-2) var(--gutter);
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.top .where { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.top .workspace { display: flex; min-width: 0; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
/* A long workspace name truncates; the shell name after it always shows. */
.top .ws-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.top .ws-shell { flex-shrink: 0; white-space: pre; }
.top .page-name { font-weight: 600; font-size: 0.9375rem; }
.top .tools { display: flex; align-items: center; gap: var(--space-1); }
/* Phone: the search takes its own row under the page name. */
.top-search {
  order: 5; flex: 1 0 100%; display: flex; align-items: center; gap: var(--space-2);
  padding: 0 var(--space-3); border: 1px solid var(--muted); border-radius: var(--radius-2); background: var(--surface); color: var(--muted);
}
.top-search input.top-search-input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0; }
.top-search input.top-search-input:focus-visible { outline: 0; }
.top-search:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.bell { position: relative; }
.bell-count {
  position: absolute; top: 2px; right: 0; min-width: 16px; height: 16px; padding: 0 4px; line-height: 16px;
  border-radius: 999px; background: var(--fail); color: var(--accent-ink); font-size: 10px; font-weight: 700; text-align: center;
  font-variant-numeric: tabular-nums;
}

/* controls */
button, .button {
  font: inherit; font-size: 0.9375rem; font-weight: 500; color: var(--ink);
  min-height: 44px; padding: 0 var(--space-4);
  background: var(--surface); border: 1px solid var(--muted); border-radius: var(--radius-2);
  cursor: pointer;
}
button.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
/* The accent outline contrasts with the page but not with a dark fill; the ring sits 2px outside the button, on the page. */
button.primary:focus-visible { outline-offset: 2px; }
button:disabled { color: var(--muted); cursor: not-allowed; }
button.primary:disabled { background: var(--surface); border-color: var(--muted); }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--muted); border-radius: var(--radius-2);
  min-height: 44px; padding: 0 var(--space-3);
}
textarea { padding: var(--space-2) var(--space-3); }
/* Ghost: the quiet secondary. The border stays 1px (transparent) so hover only changes colour, never layout. */
button.ghost { background: transparent; border-color: transparent; min-height: 36px; padding: 0 var(--space-3); font-size: 0.875rem; }
button.ghost:hover:not(:disabled) { background: var(--sel); border-color: var(--line); }
button .icon, a .icon { flex-shrink: 0; }
button.ghost, a.link-action { display: inline-flex; align-items: center; gap: var(--space-1); }
/* Icon only: the name is the aria-label and the title tooltip. 36px square keeps the hit target over 32px. */
button.icon-btn { justify-content: center; min-width: 36px; min-height: 36px; padding: 0; }
button.icon-btn[aria-pressed="true"] { color: var(--accent); }
a.link-action { min-height: 36px; }
.icon { width: 1rem; height: 1rem; vertical-align: middle; }
.icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.theme-toggle { white-space: nowrap; }

/* badges, pills and chips: one height (22px) at every density; text always carries the meaning, colour only supports it */
.badge {
  display: inline-block; height: 22px; line-height: 20px; padding: 0 var(--space-2); vertical-align: middle;
  font-size: 11px; font-weight: 600; white-space: nowrap; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); background: var(--surface);
}
.badge.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-bg); }
.badge.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-bg); }
.badge.fail { color: var(--fail); background: var(--fail-bg); border-color: var(--fail-bg); }
.badge.agent { background: transparent; color: var(--muted); border-color: var(--muted); }
.badge.demo { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-bg); }
.chip {
  position: relative; display: inline-flex; align-items: center; gap: var(--space-1);
  height: 22px; min-height: 22px; padding: 0 var(--space-2); line-height: 20px;
  font-size: 11px; font-weight: 600; white-space: nowrap; text-decoration: none;
  color: var(--muted); background: var(--surface); border: 1px solid var(--muted); border-radius: 999px;
}
.chip[aria-pressed="true"], .chip.on, .chip[aria-current="page"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.chip:focus-visible { outline-offset: 2px; }
/* A 22px chip keeps a 44px touch target: the hit area reaches 11px above and below. */
@media (pointer: coarse) { .chip::after { content: ""; position: absolute; left: 0; right: 0; top: -11px; bottom: -11px; } }
.chip.removable .icon { width: 12px; height: 12px; }

/* layout */
.frame { display: block; min-width: 0; }
.outlet { padding: var(--space-4) var(--gutter) var(--space-8); max-width: 80rem; min-width: 0; }
.rail { display: none; }
.rail ul { list-style: none; margin: 0; padding: 0; }
.side-back, .notif-back { position: fixed; inset: 0; z-index: 4; background: var(--scrim); }
.notif-host:empty { display: none; }

/* sidebar: the drawer under 900px, a column at 900px and up */
.app.drawer-open .rail {
  display: flex; position: fixed; z-index: 5; top: 0; bottom: 0; left: 0; width: min(18rem, 85vw);
}
.rail {
  flex-direction: column; gap: var(--space-4); overflow-y: auto;
  padding: var(--space-3) 10px; background: var(--surface); border-right: 1px solid var(--line);
}
.rail .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; min-width: 0; }
.rail .mark {
  display: grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: 9px;
  background: var(--btn); color: var(--btn-ink); font-weight: 700; font-size: 15px;
}
.rail .ws { display: flex; flex-direction: column; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.25; }
.rail .ws-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail .ws small { font-weight: 400; color: var(--muted); font-size: 12px; }
.rail .nl { display: grid; gap: 1px; }
.rail a, .rail .side-toggle {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 var(--space-2);
  border-radius: var(--radius-2); color: var(--muted); text-decoration: none; font-size: 14px; min-width: 0;
}
.rail a:hover { background: var(--sel); color: var(--ink); }
.rail a[aria-current="page"] { background: var(--sel); color: var(--ink); font-weight: 600; }
.rail .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.rail a > .icon { width: 18px; height: 18px; }
.rail a[aria-current="page"] > .icon { color: var(--accent); }
.rail .sub { display: grid; gap: 1px; margin: 1px 0 4px; padding-left: 18px; }
.rail .sub a { font-size: 13px; }
.rail .sub a > .icon { width: 14px; height: 14px; }
.rail .sfoot { margin-top: auto; display: none; gap: 6px; } /* the drawer closes with Esc or the scrim; slim is desktop only */
.rail .sfoot .kbd { margin-left: auto; }
.menu-btn { flex: none; }

/* notifications: a drawer on phone, a third column at 900px and up */
.notif-host { position: fixed; z-index: 5; top: 0; right: 0; bottom: 0; width: min(var(--notif-w), 100%); overflow-y: auto; background: var(--bg); border-left: 1px solid var(--line); }
.notif-panel { padding: var(--space-3) var(--space-4) var(--space-8); }
.notif-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.notif-head h2 { margin: 0; }
.notif-list { list-style: none; margin: var(--space-2) 0 0; padding: 0; }
.notif { padding: var(--space-2) 0; border-bottom: 1px solid var(--line); font-size: 0.875rem; }
.notif a { color: var(--ink); text-decoration: none; }
.notif a:hover { text-decoration: underline; }
.notif.unread a { font-weight: 600; }
.notif.unread::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: var(--space-2); border-radius: 50%; background: var(--accent); }
.notif[data-kind="gate"].unread::before { background: var(--pur); }
.notif[data-kind="failed"].unread::before { background: var(--fail); }

/* command palette and shortcuts */
.pal-back { position: fixed; inset: 0; z-index: 10; background: var(--scrim); padding: 12vh var(--gutter) 0; }
.pal {
  max-width: 560px; margin: 0 auto; max-height: 70vh; display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
}
.pal-input { width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; min-height: 48px; font-size: 1rem; background: var(--bg); }
.pal-input:focus-visible { outline: 0; }
.pal-list { list-style: none; margin: 0; padding: var(--space-1); overflow-y: auto; }
.pal-item { display: flex; align-items: center; min-height: 36px; padding: 0 var(--space-3); border-radius: var(--radius-2); cursor: pointer; font-size: 0.875rem; }
.pal-item[aria-selected="true"] { background: var(--sel); }
.pal-none { padding: var(--space-3); }
.keys-dialog { padding: var(--space-3) var(--space-4); overflow-y: auto; }
.keys { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2) var(--space-4); margin: var(--space-3) 0; font-size: 0.875rem; }
.keys dt, .keys dd { margin: 0; }

/* bottom nav, phone: one equal column per entry (four or five), icon over a short label. The current entry gets a pill
   behind its icon and a heavier label; the whole cell stays the tap target. */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background: var(--bg); border-top: 1px solid var(--line);
}
.bottom-nav a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0;
  min-height: 44px; padding: 0 var(--space-1); font-size: 0.6875rem; line-height: 1rem; color: var(--muted); text-decoration: none;
}
.bottom-nav a:focus-visible { outline-offset: -2px; border-radius: var(--radius-2); }
.bottom-nav .bn-icon { display: grid; place-items: center; width: 48px; height: 28px; border-radius: 999px; }
.bottom-nav .bn-icon .icon { width: 20px; height: 20px; }
.bottom-nav .bn-lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bottom-nav a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.bottom-nav a[aria-current="page"] .bn-icon { background: var(--accent-soft); color: var(--accent); }

/* sidebar, desktop */
@media (min-width: 900px) {
  body { padding-bottom: 0; font-size: 14px; }
  /* .top .menu-btn: the menu is a ghost button, and button.ghost would otherwise keep it on screen at desk width. */
  .bottom-nav, .top .menu-btn, .side-back, .notif-back { display: none; }
  .app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
  .app.slim { grid-template-columns: var(--side-slim) minmax(0, 1fr); }
  .rail, .app.drawer-open .rail { display: flex; position: sticky; top: 0; align-self: start; height: 100vh; width: auto; z-index: 1; }
  .rail .sfoot { display: grid; }
  .rail a, .rail .side-toggle { min-height: 32px; font-size: 13px; }
  .rail .sub a { min-height: 28px; font-size: 12.5px; }
  .app.slim .rail .ws, .app.slim .rail .sub, .app.slim .rail .sfoot .kbd { display: none; }
  /* Slim: icons only. The label leaves the layout but stays the link's and the toggle's accessible name. */
  .app.slim .rail .lbl { position: absolute; flex: none; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .app.slim .rail .brand, .app.slim .rail a, .app.slim .rail .side-toggle { justify-content: center; padding: 0; }
  .top { flex-wrap: nowrap; padding: var(--space-2) 20px; }
  .top .where { flex: 0 1 auto; max-width: 32%; }
  .top-search { order: 0; flex: 1 1 auto; max-width: 600px; margin: 0 auto; height: 32px; border-color: var(--line); }
  .top-search input.top-search-input { min-height: 30px; font-size: 13px; }
  .frame.notif-open { display: grid; grid-template-columns: minmax(0, 1fr) var(--notif-w); }
  .notif-host { position: sticky; top: var(--top-h); align-self: start; z-index: 1; width: auto; height: calc(100vh - var(--top-h)); }
  .outlet { padding: 20px 24px var(--space-12); }
  button, .button { min-height: 30px; padding: 0 var(--space-3); font-size: 13px; }
  button.ghost { min-height: 30px; font-size: 13px; }
  button.icon-btn { min-width: 32px; min-height: 32px; }
  input, select, textarea { min-height: 32px; font-size: 13px; }
  .panel summary { min-height: 32px; }
  .chip::after { display: none; }
}

/* tables and stacked rows */
table { width: 100%; border-collapse: collapse; font-size: 0.9375rem; }
th, td { text-align: left; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 0.75rem; background: var(--surface); height: 36px; vertical-align: middle; }
tbody tr:hover td { background: var(--sel); }
/* Compact density: tighter rows; chips and pills keep their height. */
:root[data-density="compact"] th, :root[data-density="compact"] td { padding-top: 2px; padding-bottom: 2px; }
:root[data-density="compact"] .rows li, :root[data-density="compact"] .item { padding: var(--space-2) 0; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { padding: var(--space-3) 0; border-bottom: 1px solid var(--line); }
.rows .primary-field { font-weight: 600; }
.rows .fields { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); color: var(--muted); font-size: 0.875rem; }
.notice { padding: var(--space-3) var(--space-4); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }

/* pages: Today, Inbox, Browse, record */
.items { list-style: none; margin: 0; padding: 0; }
.item { padding: var(--space-3) 0; border-bottom: 1px solid var(--line); }
.item.unread .item-head { font-weight: 600; }
.item-head { margin-bottom: var(--space-1); }
.item p { margin: var(--space-1) 0; }
.quiet { font-size: 1.125rem; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin-top: var(--space-2); }
.status { color: var(--muted); font-size: 0.875rem; }
.refs { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); }
.toolbar { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-3); }
.toolbar input[type="search"] { width: 100%; }
.panel summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; }
.filters { display: grid; gap: var(--space-2); padding: var(--space-2) 0; }
.field { display: flex; flex-direction: column; gap: var(--space-1); font-size: 0.875rem; }
.field.check { flex-direction: row; align-items: center; }
.field textarea, .field input[type="text"] { width: 100%; }
.count { margin: var(--space-2) 0; }
.table-wrap { overflow-x: auto; }
th button.sort { border: 0; background: transparent; padding: 0; min-height: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
tr.dropped td { color: var(--muted); }
th.star-col, td.star-col { width: 1%; padding-left: 0; padding-right: 0; white-space: nowrap; }
.toggle-dropped { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 44px; font-size: 0.875rem; }
.subtitle { color: var(--muted); margin: calc(-1 * var(--space-2)) 0 var(--space-3); }
.only-desk { display: none; }
textarea.csv { width: 100%; font-size: 0.8125rem; }
.fieldlist { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 var(--space-4); margin: 0 0 var(--space-3); }
.fieldlist dt { color: var(--muted); font-size: 0.8125rem; margin-top: var(--space-2); }
.fieldlist dd { margin: 0; overflow-wrap: anywhere; }
.spark { margin: 0 0 var(--space-3); color: var(--accent); }
.spark figcaption { font-size: 0.8125rem; }
section { margin-top: var(--space-6); }
h3 { font-size: 1rem; font-weight: 600; margin-top: var(--space-4); }
/* Record page: a main column and a side pane. One column on phones and narrow desks, pane content after the record. */
.record { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 var(--space-6); margin-top: var(--space-3); }
.record-main, .record-pane { min-width: 0; }
.summary p { max-width: 40rem; }
.record-pane input[type="search"] { width: 100%; }

/* pages: Views, Settings, Runs */
.chip-value { display: inline-flex; align-items: center; gap: var(--space-2); padding-left: var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-2); }
.chip-value button.icon-btn { border: 0; border-left: 1px solid var(--line); border-radius: 0 var(--radius-2) var(--radius-2) 0; }
.list-editor input[type="text"] { flex: 1; min-width: 12rem; }
tr.differs td { font-weight: 600; }
/* Settings used and now: fixed columns that wrap long values instead of clipping them. */
table.settings-diff { table-layout: fixed; }
table.settings-diff td { overflow-wrap: anywhere; white-space: pre-wrap; }

@media (min-width: 900px) {
  .only-phone { display: none; }
  .only-desk { display: block; }
  .toolbar { flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
  .toolbar input[type="search"] { width: 20rem; }
  .filters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .fieldlist { grid-template-columns: 12rem minmax(0, 1fr); }
  .fieldlist dt { margin-top: 0; padding: var(--space-1) 0; }
  .fieldlist dd { padding: var(--space-1) 0; }
}

/* Two panes at the desk breakpoint. The pane is 18rem, or about a third of the outlet beside the rail on a narrow desk. */
@media (min-width: 900px) {
  .record { grid-template-columns: minmax(0, 1fr) min(18rem, 35%); }
  .record-pane {
    position: sticky; top: calc(var(--top-h) + var(--space-4)); align-self: start;
    max-height: calc(100vh - var(--top-h) - var(--space-8)); overflow-y: auto;
    padding: 2px var(--space-1) 2px 2px;
  }
  .record-pane > section:first-child { margin-top: 0; }
  .record-pane > section + section { margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--line); }
}

/* Designed states (spec s12). Loading rows are static: no shimmer, no animation. */
.state { display: grid; gap: var(--space-3); justify-items: start; }
.state p { margin: 0; }
.state pre { margin: 0; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; }
.placeholder { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); width: 100%; }
.placeholder li { height: 44px; border-radius: var(--radius-2); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }

/* v2 pages: tabs, list toolbar, bulk bar, export, calendar, approvals, merge */
.tabs { display: flex; gap: var(--space-4); margin-bottom: var(--space-4); border-bottom: 1px solid var(--line); }
.tab { display: inline-flex; align-items: center; min-height: 44px; color: var(--muted); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.active { color: var(--ink); border-bottom-color: var(--ink); }
.view-menu, .panel { position: relative; }
details.panel > summary { list-style: none; display: inline-flex; align-items: center; gap: var(--space-1); padding: 0 var(--space-3); border: 1px solid var(--muted); border-radius: var(--radius-2); background: var(--surface); font-weight: 500; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel[open] > summary { background: var(--sel); }
details.panel[open] > :not(summary) { margin-top: var(--space-2); }
.count-line { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.filter-chips, .status-chips { margin-bottom: var(--space-2); }
th.select-col, td.select-col { width: 1%; padding-right: 0; }
.bulk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); margin-bottom: var(--space-3); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.bulk-bar:empty { display: none; }
details.inline { display: inline-block; }
details.inline > summary { display: inline-flex; align-items: center; min-height: 36px; padding: 0 var(--space-3); cursor: pointer; border-radius: var(--radius-2); }
details.inline[open] { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.export-dialog { padding: var(--space-4); margin: var(--space-3) 0; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.export-text textarea { width: 100%; }
.hint { font-size: 0.8125rem; }
table.calendar { table-layout: fixed; }
table.calendar td { height: 72px; padding: var(--space-1); }
.cal-day { font-size: 0.75rem; color: var(--muted); }
.cal-run { display: block; margin-top: 2px; text-decoration: none; }
.cal-run .badge { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.item.approval { border-left: 3px solid var(--pur); padding-left: var(--space-3); }
.draft { padding: var(--space-3); margin: var(--space-2) 0; border: 1px solid var(--line); border-radius: var(--radius-2); background: var(--surface); }
.draft .pre, p.pre { white-space: pre-wrap; }
.merge-choices { display: grid; gap: var(--space-2); }
.inline-suggestions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin-top: var(--space-2); padding: var(--space-2) var(--space-3); border-left: 3px solid var(--pur); background: var(--pur-bg); }
button.btn { background: var(--surface); }
</style>

function el(tag, attrs) {
  var node = document.createElement(tag);

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);

function badge(text, tone) {

}

}

// with opts.iconOnly the label becomes the aria-label and the title tooltip instead of visible text.

function chip(label, opts) {
  opts = opts || {};

function rows(items, fields) {

    var first = fields[0];
    return el("li", null,
      el("div", { class: "primary-field" }, it[first] === undefined ? "" : it[first]),

// Inline SVG built node by node; attributes only, never markup.

  var node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, String(attrs[k])); });
  for (var i = 2; i < arguments.length; i++) append(node, arguments[i]);
  return node;
}

// Stored timestamps shown exactly, as UTC minutes: 2026-10-28 08:00.
function when(iso) {
  if (!iso) return "";
  var s = String(iso);
  return /^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(s) ? s.slice(0, 10) + " " + s.slice(11, 16) : s;

// Entity doc ids are <type>--<rest>; the route carries both parts.
function entityHash(id) {
  var s = String(id);
  var i = s.indexOf("--");
  if (i === -1) return "#/today";
  return "#/entity/" + encodeURIComponent(s.slice(0, i)) + "/" + encodeURIComponent(s.slice(i + 2));

function producerLabel(definition, id) {
  var ps = (definition && definition.producers) || [];
  for (var i = 0; i < ps.length; i++) if (ps[i].id === id) return ps[i].label || id;
  return id || "";
}

// A stored URL becomes a link only over https; anything else stays plain text.
function isHttpsUrl(value) {
  try {
    return new URL(String(value)).protocol === "https:";
  } catch (e) {
    return false;
  }
}

// A short link label: the host name of an http(s) URL, without www. Anything else is returned as given.
function shortLabel(value) {
  var s = String(value);
  try {
    var u = new URL(s);
    if (u.protocol === "https:" || u.protocol === "http:") return u.hostname.replace(/^www\./, "");
  } catch (e) { /* not a URL */ }
  return s;

  return isHttpsUrl(value) ? el("a", { href: String(value), rel: "noopener noreferrer" }, String(value)) : String(value);

  try {
    var u = new URL(String(value));
    var h = u.hostname.toLowerCase();
    return u.protocol === "https:" && (h === "claude.ai" || h.endsWith(".claude.ai"));
  } catch (e) {
    return false;
  }

  if (seg.some(function (s) { return !s; })) return false;
  if (seg.length === 2) return PEOPLE_COLLECTIONS.indexOf(seg[0]) !== -1;
  if (seg.length === 4 && seg[0] === "people") return !!viewer && seg[1] === String(viewer) && seg[2] === "decisions";
  return !!viewer && seg.length === 6 && seg[0] === "data" && seg[1] === "users" && seg[2] === String(viewer) &&
    seg[3] === "state" && VIEWER_STATE_KINDS.indexOf(seg[4]) !== -1;
}

function save(store, viewer, path, doc) {
  if (!writable(path, viewer)) return Promise.reject(new PathError(path));
  return store.set(path, doc);
}

function remove(store, viewer, path) {
  if (!writable(path, viewer)) return Promise.reject(new PathError(path));
  return store.del(path);
}

// Whether this visit may write at all. No viewer id means no attributable write, so nothing is written.
function canWrite(ctx) {
  if (ctx.store && ctx.store.readOnly) return { ok: false, reason: READ_ONLY_NOTE };
  if (!ctx.viewer) return { ok: false, reason: SIGN_IN_NOTE };
  return { ok: true, reason: "" };
}

function isQuota(e) {
  return !!e && (e.code === "quota_exceeded" || /quota_exceeded/.test(String(e.message || "")));
}

function writeMessage(e) {
  if (e && e.name === "ReadOnlyError") return READ_ONLY_NOTE;
  if (e && e.partial) return e.message;
  if (isQuota(e)) return QUOTA_NOTE;
  return "Not saved: " + ((e && e.message) || "the write was refused");
}

// A button that runs one write. While it runs the button is disabled; the outcome is stated in
// `status` (an element the caller places). On the read-only store, or with no viewer id, every action is
// disabled and its title says why.
function actionButton(ctx, label, run, opts) {
  opts = opts || {};
  var allowed = canWrite(ctx);
  var b = button(label, null, {
    primary: opts.primary,
    disabled: !allowed.ok || opts.disabled,
    title: !allowed.ok ? allowed.reason : opts.title,
    icon: opts.icon,
    iconOnly: opts.iconOnly,
    pressed: opts.pressed,
  });
  b.addEventListener("click", function (e) {
    if (e && e.stopPropagation) e.stopPropagation();
    b.disabled = true;
    if (opts.status) opts.status.textContent = "Saving";
    Promise.resolve().then(run).then(function () {
      if (opts.status) opts.status.textContent = opts.done || "Saved.";
      b.disabled = false;
    }, function (e) {
      if (opts.status) opts.status.textContent = writeMessage(e);
      b.disabled = false;
    });
  });
  return b;
}

// The star toggle: an icon button, outline when off and filled when on. The name says what a press does
// ("Star <name>" or "Unstar <name>") and aria-pressed carries the current state.
function starToggle(ctx, name, starred, run, opts) {
  opts = opts || {};
  return actionButton(ctx, (starred ? "Unstar " : "Star ") + name, run, {
    icon: starred ? "star-filled" : "star", iconOnly: true, pressed: !!starred, status: opts.status, done: opts.done,
  });
}

function stamp(ctx) {
  return { at: new Date().toISOString(), by: ctx.viewer || null };
}

var NO_VIEWER_NOTE = "Read and done are not available for this visit.";

// specs: {name: {collection, q}}. cb gets {name: docs} once every collection has answered, then on each change.
function watchAll(ctx, specs, cb, onError) {
  var names = Object.keys(specs);
  var got = {};
  var waiting = names.length;
  var stops = names.map(function (name) {
    var first = true;
    var q = Object.assign({}, specs[name].q || {}, { onError: onError || function () {} });
    return ctx.store.subscribe(specs[name].collection, function (docs) {
      got[name] = docs;
      if (first) { first = false; waiting--; }
      if (waiting === 0) cb(got);
    }, q);
  });
  return function () { stops.forEach(function (stop) { stop(); }); };
}

// Adds the viewer's read/done/ack collections to a watch; nothing is added without a viewer id.
function withViewerState(ctx, specs, kinds) {
  if (ctx.viewer) kinds.forEach(function (k) { specs[k] = { collection: "data/users/" + ctx.viewer + "/state/" + k }; });
  return specs;
}

function idSet(docs) {
  return docs ? new Set(docs.map(function (d) { return d.id; })) : null;
}

// No prototype: a doc id like "__proto__" or "constructor" is a plain key (db.d.ts allows both).
function byId(docs) {
  var out = Object.create(null);
  (docs || []).forEach(function (d) { out[d.id] = d.data; });
  return out;
}

// A person's reason read straight from decisions/, capped like the contract's MAX_PERSON_REASON (code points).
var PERSON_REASON_MAX = 200;
function shownReason(reason) {
  return Array.from(String(reason)).slice(0, PERSON_REASON_MAX).join("");
}

function markViewer(ctx, kind, id, on) {
  var path = viewerPath(ctx.viewer, kind, id);
  return on ? save(ctx.store, ctx.viewer, path, stamp(ctx)) : remove(ctx.store, ctx.viewer, path);
}

// Snooze an inbox item for this viewer until an ISO time (spec "Inbox"). {until, at, by}.
function snoozeItem(ctx, id, until) {
  if (!until) return Promise.reject(new Error("pick when to bring it back."));
  return save(ctx.store, ctx.viewer, viewerPath(ctx.viewer, "snooze", id), Object.assign({ until: until }, stamp(ctx)));
}

function producerSetting(definition, producer, setting) {
  var p = ((definition && definition.producers) || []).filter(function (x) { return x.id === producer; })[0];
  return p && (p.settings || []).filter(function (x) { return x.name === setting; })[0];
}

function producerDefault(definition, producer, setting) {
  var s = producerSetting(definition, producer, setting);
  return s ? s.default : undefined;
}

// Re-reads settings/<producer> right before writing; last write wins, no conflict screen.
function writeSetting(ctx, producer, setting, change) {
  var path = "settings/" + producer;
  return ctx.store.get(path).then(function (cur) {
    var data = Object.assign({}, cur.exists ? cur.data : {});
    var values = Object.assign({}, data.values || {});
    var before = setting in values ? values[setting] : producerDefault(ctx.definition, producer, setting);
    values[setting] = change(before);
    data.values = values;
    data.updatedAt = new Date().toISOString();
    data.updatedBy = ctx.viewer || null;
    return save(ctx.store, ctx.viewer, path, data);
  });
}

var HISTORY_CAP = 50;

// Entries past the cap, newest kept: the ids to delete.
function historyToPrune(entries, cap) {
  var sorted = (entries || []).slice().sort(function (a, b) {
    var x = a.data.at || "", y = b.data.at || "";
    return x === y ? (a.id < b.id ? 1 : -1) : (x < y ? 1 : -1);
  });
  return sorted.slice(cap).map(function (e) { return e.id; });
}

// The values to write to undo one history entry: its before values for the keys it changed.
function revertChange(entry) {
  var out = {};
  Object.keys(entry.after || {}).forEach(function (k) {
    var b = (entry.before || {})[k];
    out[k] = b === undefined ? null : b;
  });
  return out;
}

// Settings page: re-reads the settings doc right before writing and replaces only the keys given.
// Last write wins, no conflict screen. Then records settingsHistory/<producer>--<time digits>
// {producer, before, after, at, by} and prunes that producer's history to HISTORY_CAP.
function writeSettings(ctx, path, changes) {
  var producer = String(path).split("/").pop();
  var before = {};
  return ctx.store.get(path).then(function (cur) {
    var data = Object.assign({}, cur.exists ? cur.data : {});
    var values = data.values || {};
    Object.keys(changes).forEach(function (k) {
      var b = k in values ? values[k] : producerDefault(ctx.definition, producer, k);
      before[k] = b === undefined ? null : b;
    });
    data.values = Object.assign({}, values, changes);
    data.updatedAt = new Date().toISOString();
    data.updatedBy = ctx.viewer || null;
    return save(ctx.store, ctx.viewer, path, data);
  }).then(function () {
    var s = stamp(ctx);
    var entry = { producer: producer, before: before, after: Object.assign({}, changes), at: s.at, by: s.by };
    return save(ctx.store, ctx.viewer, "settingsHistory/" + producer + "--" + s.at.replace(/\D/g, ""), entry).then(function () {
      return ctx.store.list("settingsHistory", { where: [["producer", "==", producer]] });
    }).then(function (rows) {
      return historyToPrune(rows, HISTORY_CAP).reduce(function (p, id) {
        return p.then(function () { return remove(ctx.store, ctx.viewer, "settingsHistory/" + id); });
      }, Promise.resolve());
    }).catch(function (e) {
      var err = new Error("Saved. The change was not added to the settings history: " + (isQuota(e) ? QUOTA_NOTE : (e && e.message) || "the write was refused"));
      err.partial = true;
      throw err;
    });
  });
}

function addExclusion(ctx, producer, setting, value) {
  return writeSetting(ctx, producer, setting, function (list) {
    list = Array.isArray(list) ? list.slice() : [];
    var lower = String(value).toLowerCase();
    if (!list.some(function (v) { return String(v).toLowerCase() === lower; })) list.push(value);
    return list;
  });
}

// extra carries a learned proposal's key (and a snooze's until), the ids the routine's rejection memory reads.
function decide(ctx, id, decision, extra) {
  return save(ctx.store, ctx.viewer, "decisions/" + id, Object.assign({ decision: decision }, extra || {}, stamp(ctx)));
}

// people/<viewer>/decisions/<id>: a decision the Desk's db rules (DESK_DB_RULES) let only that person write, so the
// path itself says who decided. Lane decisions a worker run honours (verified, release, its gate approvals) live here.
function personPath(viewer, id) {
  return "people/" + viewer + "/decisions/" + id;
}

function decidePerson(ctx, id, decision, extra) {
  return save(ctx.store, ctx.viewer, personPath(ctx.viewer, id), Object.assign({ decision: decision }, extra || {}, stamp(ctx)));
}

// Desk v2 drop: a person's drop with a reason. The producer marks the record dropped on its next run.
function dropRecord(ctx, id, reason) {
  var r = String(reason || "").trim();
  if (!r) return Promise.reject(new Error("give a reason for the drop."));
  return decide(ctx, id, "drop", { reason: r });
}

// Restore: a person's own drop is undone (the routine's filters still apply on the next run); a record the
// routine dropped is kept, which feeds the override learn signal.
function restoreRecord(ctx, id, decision) {
  if (decision && decision.decision === "drop") return remove(ctx.store, ctx.viewer, "decisions/" + id);
  return decide(ctx, id, "keep");
}

var BAD_PROPOSAL_NOTE = "this proposal names no setting or no new value";
var PR_PROPOSAL_NOTE = "this change opens a PR; Accept writes no setting";
var EMPTY_INCLUDE_NOTE = "this would leave an include list empty, so it would match nothing";
var SNOOZE_DAYS = 7;

// One per-item change applied to the value as it is now: add once, remove by casefold, set replaces.
function applyOp(current, p) {
  if (p.op === "set") return p.value;
  var list = Array.isArray(current) ? current.slice() : [];
  var lower = String(p.value).toLowerCase();
  var has = function (v) { return String(v).toLowerCase() === lower; };
  if (p.op === "remove") return list.filter(function (v) { return !has(v); });
  if (!list.some(has)) list.push(p.value);
  return list;
}

function proposalLevel(p) {
  return p && typeof p === "object" && p.level ? p.level : "L1";
}

function keyExtra(msg) {
  var p = msg.data.proposal;
  return p && typeof p === "object" && typeof p.key === "string" ? { key: p.key } : {};
}

function rejectProposal(ctx, msg) {
  return decide(ctx, msg.id, "reject", keyExtra(msg));
}

function snoozeProposal(ctx, msg, now) {
  var until = new Date((now === undefined ? Date.now() : now) + SNOOZE_DAYS * 86400000).toISOString();
  return decide(ctx, msg.id, "snooze", Object.assign(keyExtra(msg), { until: until }));
}

// A proposal is {setting, from, to}. Messages stored before the write contract checked the shape may carry
// {current, suggested} instead; those are read as from and to.
function normalizeProposal(p) {
  p = p && typeof p === "object" ? p : {};
  return { setting: p.setting, from: "from" in p ? p.from : p.current, to: "to" in p ? p.to : p.suggested };
}

// Accept writes the proposed value first, then the decision; dismiss writes only the decision.
// A proposal without a setting or a new value writes nothing and records no decision. A per-item proposal
// (with op) applies its item to the current value, so edits made since the run are kept. L2 and L3 write nothing,
// and no Accept may leave an include list empty.
function acceptProposal(ctx, msg) {
  var raw = msg.data.proposal;
  if (proposalLevel(raw) !== "L1") return Promise.reject(new Error(PR_PROPOSAL_NOTE));
  var item = raw && typeof raw === "object" && raw.op ? raw : null;
  var p = normalizeProposal(raw);
  if (typeof p.setting !== "string" || !p.setting || (!item && p.to === undefined)) return Promise.reject(new Error(BAD_PROPOSAL_NOTE));
  var include = (producerSetting(ctx.definition, msg.data.producer, p.setting) || {}).role === "include";
  var change = function (cur) {
    var next = item ? applyOp(cur, item) : p.to;
    if (include && Array.isArray(next) && !next.length) throw new Error(EMPTY_INCLUDE_NOTE);
    return next;
  };
  return writeSetting(ctx, msg.data.producer, p.setting, change).then(function () {
    return decide(ctx, msg.id, "accept", keyExtra(msg));
  });
}

// meta/owner {by, at}: who owns this Desk. The Desk is published with a db rule that lets only the artifact's
// owner write meta/ (DESK_DB_RULES), and the page writes it only when user.isOwner() is true, so no other viewer
// can create or replace it. Page writes carry no version pin, so create-only is a read, a write, then a read back.
// A stored record that disagrees with isOwner() in either direction (the owner sees someone else's id, or a
// non-owner sees their own) is tampered: ctx.ownerTampered is set and no owner is accepted.
var OWNER_PATH = "meta/owner";

function ensureOwner(ctx) {
  var store = ctx.store;
  if (!ctx.viewer || !store || typeof store.isOwner !== "function") return Promise.resolve(ctx.owner || null);
  var viewer = String(ctx.viewer);
  function tampered() { ctx.owner = null; ctx.ownerTampered = true; return null; }
  return store.isOwner().then(function (yes) {
    var known = ctx.owner;
    if (yes !== true) {
      if (known && known.by === viewer) return tampered();
      return known || store.get(OWNER_PATH).then(function (cur) {
        if (cur.exists && cur.data && cur.data.by === viewer) return tampered();
        return cur.exists ? cur.data : null;
      });
    }
    if (known) return known.by === viewer ? known : tampered();
    return store.get(OWNER_PATH).then(function (cur) {
      if (cur.exists) return cur.data && cur.data.by === viewer ? cur.data : tampered();
      if (store.readOnly) return null;
      return store.set(OWNER_PATH, { by: viewer, at: new Date().toISOString() }).then(function () {
        return store.get(OWNER_PATH);
      }).then(function (back) {
        if (!back.exists) return null;
        return back.data && back.data.by === viewer ? back.data : tampered();
      });
    });
  }).then(function (owner) {
    if (ctx.ownerTampered) return null;
    if (owner && typeof owner === "object" && typeof owner.by === "string") ctx.owner = owner;
    return ctx.owner || null;
  }, function () { return ctx.ownerTampered ? null : ctx.owner || null; });
}

// No meta/owner means nobody is the owner on the page: owner-only controls stay hidden for everyone.
function isDeskOwner(ctx) {
  return !!(ctx && ctx.owner && ctx.viewer && ctx.owner.by === ctx.viewer);
}

var RELEASE_KEY_RE = /^[a-z][a-z0-9-]*--[a-z0-9-]+$/;
var RELEASE_ASK = "Release this lane? Its worker's next run stops, and someone else can join it.";

var RELEASE_HOLDER_RE = /^[A-Za-z0-9_-]{1,64}$/;

// Owner only, after a confirm: people/<owner id>/decisions/release--<laneKey> {decision: "release", holder, at, by}.
// ask(question) is the in-page confirm (the Desk uses no blocking dialogs); anything but true resolves false and writes
// nothing. The worker's run honours it only under meta/owner.by's own people path, which the db rules let nobody else
// write. holder is the Desk id of the worker released: the release is final for that holder, whatever joinedAt in
// workers/ (writable by any Contributor) says, until the owner removes it.
function releaseLane(ctx, laneKey, ask, holder) {
  if (!isDeskOwner(ctx)) return Promise.reject(new Error("only the Desk owner can release a lane."));
  if (typeof laneKey !== "string" || !RELEASE_KEY_RE.test(laneKey)) return Promise.reject(new Error("this lane key is not valid."));
  if (typeof holder !== "string" || !RELEASE_HOLDER_RE.test(holder)) return Promise.reject(new Error("this lane names no worker to release."));
  if (typeof ask !== "function" || ask(RELEASE_ASK) !== true) return Promise.resolve(false);
  return decidePerson(ctx, "release--" + laneKey, "release", { holder: holder }).then(function () { return true; });
}

function decisionWord(dec) {
  return { accept: "Accepted", dismiss: "Dismissed", reject: "Rejected", snooze: "Snoozed" }[dec.decision] || "Decided";
}

if (typeof module === "object" && module.exports) {
  module.exports = {
    writable: writable, save: save, remove: remove, PathError: PathError, viewerPath: viewerPath,
    NO_VIEWER_NOTE: NO_VIEWER_NOTE, READ_ONLY_NOTE: READ_ONLY_NOTE, actionButton: actionButton, starToggle: starToggle,
    normalizeProposal: normalizeProposal, acceptProposal: acceptProposal, writeMessage: writeMessage, decide: decide, stamp: stamp,
    applyOp: applyOp, proposalLevel: proposalLevel, rejectProposal: rejectProposal, snoozeProposal: snoozeProposal,
    decisionWord: decisionWord, PR_PROPOSAL_NOTE: PR_PROPOSAL_NOTE,
    dropRecord: dropRecord, restoreRecord: restoreRecord, snoozeItem: snoozeItem, markViewer: markViewer,
    canWrite: canWrite, isQuota: isQuota, SIGN_IN_NOTE: SIGN_IN_NOTE, QUOTA_NOTE: QUOTA_NOTE,
    PEOPLE_COLLECTIONS: PEOPLE_COLLECTIONS, writeSettings: writeSettings, HISTORY_CAP: HISTORY_CAP,
    historyToPrune: historyToPrune, revertChange: revertChange, byId: byId, shownReason: shownReason,
    ensureOwner: ensureOwner, isDeskOwner: isDeskOwner, releaseLane: releaseLane, OWNER_PATH: OWNER_PATH, RELEASE_ASK: RELEASE_ASK,
    personPath: personPath, decidePerson: decidePerson,
  };
}

/* src/bulk.js */
/* src/bulk.js: bulk actions on many records (spec "Bulk actions"). The store has no batch verb for pages, so
   writes run one at a time with progress, and the summary says how many failed and which. Undo reverts the
   writes that succeeded, for 10 seconds. */

var BULK_CAP = 1000;
var UNDO_MS = 10000;

function bulkCount_(n) {
  return Number(n).toLocaleString("en-US");
}

function checkScope(n) {
  if (!n) return { ok: false, reason: "Select at least one record." };
  if (n > BULK_CAP) return { ok: false, reason: "This would change " + bulkCount_(n) + " records. A bulk action can change at most " + bulkCount_(BULK_CAP) + "; narrow the filter first." };
  return { ok: true, reason: null };
}

function bulkMessage_(e) {
  if (typeof isQuota === "function" && isQuota(e)) return QUOTA_NOTE;
  return (e && e.message) || String(e);
}

// items: [{id, ...}]; write(item) returns a promise. Sequential on purpose. Resolves {done: [ids], failed: [{id, message}]}.
function runBulk(items, write, onProgress) {
  var res = { done: [], failed: [] };
  var i = 0;
  function step() {
    if (i >= items.length) return Promise.resolve(res);
    var it = items[i++];
    return Promise.resolve().then(function () { return write(it); }).then(function () {
      res.done.push(it.id);
    }, function (e) {
      res.failed.push({ id: it.id, message: bulkMessage_(e) });
    }).then(function () {
      if (onProgress) onProgress(i, items.length);
      return step();
    });
  }
  return step();
}

// Revert the ids that succeeded, one at a time. Resolves {failed: [{id, message}]}.
function undoBulk(done, revert) {
  return runBulk(done.map(function (id) { return { id: id }; }), function (it) { return revert(it.id); }).then(function (r) {
    return { failed: r.failed };
  });
}

// "Done 8, failed 2: Role 3, Role 7." Names come from items' name, else the id.
function bulkSummary(res, items) {
  var names = {};
  (items || []).forEach(function (it) { names[it.id] = it.name || it.id; });
  var s = "Done " + res.done.length;
  if (!res.failed.length) return s + ".";
  return s + ", failed " + res.failed.length + ": " + res.failed.map(function (f) { return names[f.id] || f.id; }).join(", ") + ".";
}

// Shift-click: add every id between anchor and target (inclusive) to set, in either direction.
function rangeSelect(ids, anchor, target, set) {
  var a = ids.indexOf(anchor), b = ids.indexOf(target);
  if (a === -1 || b === -1) { set.add(target); return set; }
  var lo = Math.min(a, b), hi = Math.max(a, b);
  for (var k = lo; k <= hi; k++) set.add(ids[k]);
  return set;
}

if (typeof module === "object" && module.exports) {
  module.exports = { BULK_CAP: BULK_CAP, UNDO_MS: UNDO_MS, checkScope: checkScope, runBulk: runBulk, undoBulk: undoBulk,
    bulkSummary: bulkSummary, rangeSelect: rangeSelect };
}

/* src/states.js */
/* src/states.js: designed empty, loading and error states (spec s12). Each one says what is true in
   fixed words and offers at most one next action. Loading is static placeholder rows, never animated. */

var SEED_COMMAND = "python3 skills/routineos/scripts/routineos.py seed <routine-folder> --out <batch-dir>";
var PLACEHOLDER_ROWS = 3;

function nextRunLine(n) {
  return n.at ? n.label + " runs next at " + when(n.at) + " UTC." : n.label + " has not run yet. Its schedule is on the routines page.";
}

var INBOX_EMPTY = {
  all: ["No messages yet.", "Routines post here when they find something or need a decision."],
  unread: ["Nothing unread.", "Every message here has been read or marked done."],
  done: ["Nothing marked done yet.", "Messages you mark done move here."],
  snoozed: ["Nothing snoozed.", "Snoozed messages wait here and come back when the snooze ends."],
};

// kind: no-db, not-set-up, first-run, loading, read-error, per-viewer-off, empty-filter, quiet, read-only, inbox-empty.
// d carries the words that vary: collection or plural names, producers, and the callbacks for the action.
function stateView(kind, d) {
  d = d || {};
  switch (kind) {
    case "no-db":
      return el("p", { class: "notice state" }, "This page needs the db capability. Republish it with db declared.");
    case "not-set-up":
      return el("div", { class: "state" },
        el("p", null, (d.name || "This workspace") + " is not set up yet. Once seeded, it shows what its routines find, the messages that need you and each run's health."),
        el("p", null, "Seed it with one command, then apply the batch files it writes in order:"),
        el("pre", { class: "mono" }, SEED_COMMAND));
    case "first-run":
      if (d.next) {
        return el("div", { class: "state" }, el("p", null, "Nothing has run yet."),
          el("ul", { class: "rows" }, d.next.map(function (n) { return el("li", null, nextRunLine(n)); })));
      }
      return el("div", { class: "state" },
        el("p", null, "No " + d.plural + " yet." +
          (d.sources && d.sources.length ? " They appear after " + d.sources.join(" or ") + " runs." : " They appear after a producer run.") +
          (d.settings && d.settings.length ? " Shaped by the setting " + d.settings.join(", ") + "." : "")),
        d.settings && d.settings.length ? el("a", { href: "#/settings" }, "Open Settings") : null);
    case "loading":
      return el("div", { class: "state", "aria-busy": "true" },
        el("p", { class: "muted" }, "Loading " + (d.label || "")),
        el("ul", { class: "placeholder", "aria-hidden": "true" },
          Array.apply(null, Array(PLACEHOLDER_ROWS)).map(function () { return el("li"); })));
    case "read-error":
      return el("div", { class: "notice state", role: "alert" },
        el("p", null, icon("triangle-alert"), " Could not read " + (d.collection || "this page") + "." + (d.whole ? "" : " Other pages still work.")),
        d.onRetry ? button("Try again", d.onRetry) : null);
    case "per-viewer-off":
      return el("p", { class: "muted state" }, NO_VIEWER_NOTE);
    case "empty-filter":
      return el("div", { class: "state" },
        el("p", null, "No " + d.plural + " match these filters."),
        d.onClear ? button("Clear filters", d.onClear) : null);
    case "quiet":
      return el("div", { class: "state" }, el("p", { class: "quiet" }, "Nothing needs you."), d.lastRuns || null);
    case "inbox-empty":
      var words = INBOX_EMPTY[d.filter] || INBOX_EMPTY.all;
      return el("div", { class: "state" }, el("p", { class: "quiet" }, words[0]), el("p", { class: "muted" }, words[1]));
    case "suggestions-empty":
      return el("div", { class: "state" }, el("p", { class: "quiet" }, "No suggestions waiting."),
        el("p", { class: "muted" }, "A routine suggests a change here when what people kept or dropped shows a pattern."));
    case "read-only":
      return el("p", { class: "muted state" }, READ_ONLY_NOTE + ". Changes cannot be saved on this page.");
  }
  return null;
}

if (typeof module === "object" && module.exports) {
  module.exports = { stateView: stateView, SEED_COMMAND: SEED_COMMAND };
}

/* src/pages/today.js */
/* src/pages/today.js: what needs the viewer now (spec s8 item 1). One primary action per item. */

var TODAY_MESSAGE_KINDS = ["match", "alert"];
var TODAY_OPEN_GATE = ["waiting", "pending", undefined, null, ""];

function newestFirst(field) {
  return function (a, b) {
    var x = a.data[field] || "", y = b.data[field] || "";
    return x === y ? (a.id < b.id ? -1 : 1) : (x < y ? 1 : -1);
  };
}

// data: {definition, inbox, runs, views, columns, pending, decisions, read, done, ack}; docs are {id, data};
// read, done and ack are Sets, or null when the visit has no viewer id.
function todayItems(data) {
  var decided = new Set((data.decisions || []).map(function (d) { return d.id; }));
  var inbox = (data.inbox || []).slice().sort(newestFirst("createdAt"));
  var items = [];

  var messages = inbox.filter(function (m) { return TODAY_MESSAGE_KINDS.indexOf(m.data.kind) !== -1; });
  if (data.read && data.done) {
    messages.forEach(function (m) {
      if (!data.read.has(m.id) && !data.done.has(m.id)) items.push({ kind: "message", id: m.id, doc: m });
    });
  } else if (messages.length) {
    items.push({ kind: "inbox-count", id: "inbox", count: messages.length });
  }

  var producers = ((data.definition && data.definition.producers) || []);
  var latest = {};
  (data.runs || []).slice().sort(newestFirst("startedAt")).forEach(function (r) {
    if (!latest[r.data.producer]) latest[r.data.producer] = r;
  });
  var lastRuns = producers.map(function (p) {
    var r = latest[p.id];
    return { producer: p.id, label: p.label || p.id, runId: r ? r.id : null, run: r ? r.data : null };
  });
  lastRuns.forEach(function (lr) {
    var bad = lr.run && (lr.run.status === "partial" || lr.run.status === "failed");
    if (bad && !(data.ack && data.ack.has(lr.runId))) items.push({ kind: "run", id: lr.runId, doc: { id: lr.runId, data: lr.run } });
  });

  (data.views || []).forEach(function (v) { if (v.data.state === "proposed") items.push({ kind: "view", id: v.id, doc: v }); });
  (data.columns || []).forEach(function (c) { if (c.data.state === "proposed") items.push({ kind: "column", id: c.id, doc: c }); });

  inbox.forEach(function (m) {
    if (m.data.kind === "proposal" && !decided.has(m.id)) items.push({ kind: "proposal", id: m.id, doc: m });
  });

  (data.pending || []).forEach(function (g) {
    if (TODAY_OPEN_GATE.indexOf(g.data.status) === -1 || decided.has(g.id)) return;
    var msg = inbox.filter(function (m) { return m.data.gate === g.id; })[0] || null;
    items.push({ kind: "gate", id: g.id, doc: g, message: msg });
  });

  return { items: items, lastRuns: lastRuns };
}

function runLine(definition, run) {
  var d = run.data;
  var bits = [producerLabel(definition, d.producer) + " run " + d.status];
  if (typeof d.parsed === "number" && typeof d.claimed === "number") bits.push("parsed " + d.parsed + " of " + d.claimed + " source" + (d.claimed === 1 ? "" : "s"));
  if (d.startedAt) bits.push("started " + when(d.startedAt));
  return bits.join(", ");
}

// The proposal sentence. A proposal stored without from or to (a fault in what the routine wrote) names the
// setting only; without a setting there is no sentence and the card shows its title alone.
function proposalText(producer, p) {
  p = normalizeProposal(p);
  if (!p.setting) return null;
  if (p.from === undefined || p.to === undefined) return producer + " proposes a change to " + p.setting + ".";
  return producer + " proposes " + p.setting + ": from " + JSON.stringify(p.from) + " to " + JSON.stringify(p.to) + ".";
}

function todayItem(ctx, it) {
  var status = el("span", { class: "status", role: "status" });
  var defn = ctx.definition;
  var head, body = null, actions = [];
  if (it.kind === "message") {
    head = [badge(it.doc.data.kind), " ", it.doc.data.title || "Untitled"];
    body = it.doc.data.why || null;
    actions.push(actionButton(ctx, "Mark read", function () { return markViewer(ctx, "read", it.id, true); }, { icon: "check", status: status }));
  } else if (it.kind === "inbox-count") {
    head = it.count === 1 ? "1 message in the Inbox" : it.count + " messages in the Inbox";
    body = NO_VIEWER_NOTE;
    actions.push(el("a", { href: "#/inbox" }, "Open Inbox"));
  } else if (it.kind === "run") {
    head = [badge(it.doc.data.status, it.doc.data.status === "failed" ? "fail" : "warn"), " ", runLine(defn, it.doc)];
    if (ctx.viewer) {
      actions.push(actionButton(ctx, "Acknowledge", function () { return markViewer(ctx, "ack", it.id, true); }, { icon: "check", status: status }));
    } else {
      body = "Acknowledging needs a viewer id, which this visit does not have.";
    }
    actions.push(el("a", { href: "#/history/" + encodeURIComponent(it.id) }, "Open run"));
  } else if (it.kind === "view" || it.kind === "column") {
    head = ["Proposed " + it.kind + ": ", it.doc.data.name || it.id, " ", agentBadge(producerLabel(defn, it.doc.data.producer))];
    // Proposed views and columns are both kept or deleted on the Views page.
    actions.push(el("a", { href: "#/views" }, "Review"));
  } else if (it.kind === "proposal") {
    var p = it.doc.data.proposal || {};
    head = it.doc.data.title || "Setting proposal";
    body = proposalText(producerLabel(defn, it.doc.data.producer), p);
    if (proposalLevel(p) === "L1") actions.push(actionButton(ctx, "Accept", function () { return acceptProposal(ctx, it.doc); }, { primary: true, status: status, done: NEXT_RUN_NOTE }));
    actions.push(actionButton(ctx, "Dismiss", function () { return decide(ctx, it.id, "dismiss"); }, { icon: "x", status: status }));
  } else if (it.kind === "gate") {
    head = (it.message && it.message.data.title) || "Approval waiting";
    body = GATE_NOTE;
    actions.push(actionButton(ctx, "Approve", function () { return decide(ctx, it.id, "approve"); }, { primary: true, status: status }));
    actions.push(actionButton(ctx, "Reject", function () { return decide(ctx, it.id, "reject"); }, { icon: "x", status: status }));
  }
  return el("li", { class: "item", "data-kind": it.kind },
    el("div", { class: "item-head" }, head),
    body ? el("p", { class: "muted" }, body) : null,
    el("div", { class: "actions" }, actions, status));
}

function lastRunList(defn, lastRuns) {
  return el("ul", { class: "rows" }, lastRuns.map(function (lr) {
    return el("li", null,
      el("div", { class: "primary-field" }, lr.label),
      el("div", { class: "fields" }, lr.runId
        ? [el("span", null, "Last run " + when(lr.run.startedAt)), el("span", null, lr.run.status), el("a", { href: "#/history/" + encodeURIComponent(lr.runId) }, "Open run")]
        : el("span", null, "Has not run yet")));
  }));
}

function renderToday(outlet, ctx) {
  var box = el("div", { class: "page" }, el("h1", null, "Today"), stateView("loading", { label: "today" }));
  append(outlet, box);
  var specs = withViewerState(ctx, {
    inbox: { collection: "inbox" }, runs: { collection: "runs" }, views: { collection: "views" },
    columns: { collection: "columns" }, pending: { collection: "pending" }, decisions: { collection: "decisions" },
  }, ["read", "done", "ack"]);
  return watchAll(ctx, specs, function (got) {
    var r = todayItems({
      definition: ctx.definition, inbox: got.inbox, runs: got.runs, views: got.views, columns: got.columns,
      pending: got.pending, decisions: got.decisions,
      read: idSet(got.read), done: idSet(got.done), ack: idSet(got.ack),
    });
    clear(box);
    append(box, el("h1", null, "Today"));
    if (!got.runs.length && !r.items.length) {
      // First run: nothing has run, so name each producer and when it runs next (cron is UTC).
      append(box, stateView("first-run", { next: ((ctx.definition && ctx.definition.producers) || []).map(function (p) {
        return { label: p.label || p.id, at: nextRun(p.schedule) };
      }) }));
    } else if (!r.items.length) {
      append(box, stateView("quiet", { lastRuns: [el("h2", null, "Last run per producer"), lastRunList(ctx.definition, r.lastRuns)] }));
    } else {
      append(box, el("ul", { class: "items" }, r.items.map(function (it) { return todayItem(ctx, it); })));
    }
  }, function () {
    clear(box);
    append(box, [el("h1", null, "Today"), stateView("read-error", { collection: "today's messages and runs", onRetry: ctx.retry })]);
  });
}

if (typeof module === "object" && module.exports) {
  module.exports = { todayItems: todayItems, proposalText: proposalText };
}

/* src/pages/inbox.js */
/* src/pages/inbox.js: every message a producer wrote, newest first (spec s8 item 2).
   Actions follow the message kind; the stored `actions` field is never trusted as markup or code. */

var NEXT_RUN_NOTE = "Saved. Applies from the next run.";
var GATE_NOTE = "Recorded here. A later run acting on it is not piloted.";
var INBOX_FILTERS = [["all", "All"], ["unread", "Unread"], ["done", "Done"], ["snoozed", "Snoozed"]];
var SNOOZE_CHOICES = [["1d", "1 day"], ["3d", "3 days"], ["7d", "7 days"]];
var INBOX_TABS = [["inbox", "Inbox"], ["suggestions", "Suggestions"]];

// Kept local so the pure functions below load on their own under node.
function inboxNewest(field) {
  return function (a, b) {
    var x = a.data[field] || "", y = b.data[field] || "";
    return x === y ? (a.id < b.id ? -1 : 1) : (x < y ? 1 : -1);
  };
}

// "1d", "3d", "7d" from now, or a YYYY-MM-DD date (its local midnight, which must be in the future). ISO or null.
function snoozeUntil(choice, now) {
  var t = now instanceof Date ? now.getTime() : (now === undefined ? Date.now() : new Date(now).getTime());
  var days = { "1d": 1, "3d": 3, "7d": 7 }[choice];
  if (days) return new Date(t + days * 86400000).toISOString();
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(choice || ""));
  if (!m) return null;
  var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return d.getTime() > t ? d.toISOString() : null;
}

// state: {read, done} as Sets and snooze as a Map id -> until, or null without a viewer id (then every
// message shows). An item snoozed past now shows only under "snoozed"; once due it is back everywhere.
function inboxList(msgs, state, filter, now) {
  var out = (msgs || []).slice().sort(inboxNewest("createdAt"));
  if (!state || !state.read || !state.done) return out;
  var at = new Date(now === undefined ? Date.now() : now).toISOString();
  var snoozed = function (m) { var u = state.snooze && state.snooze.get(m.id); return !!u && u > at; };
  if (filter === "snoozed") return out.filter(snoozed);
  out = out.filter(function (m) { return !snoozed(m); });
  if (filter === "all") return out;
  if (filter === "unread") return out.filter(function (m) { return !state.read.has(m.id) && !state.done.has(m.id); });
  if (filter === "done") return out.filter(function (m) { return state.done.has(m.id); });
  return out;
}

// What Mark all read writes: shown items that are neither read nor done.
function unreadIds(shown, state) {
  return (shown || []).filter(function (m) { return !state.read.has(m.id) && !state.done.has(m.id); }).map(function (m) { return m.id; });
}

function inboxTab(params) {
  var t = params && params.query && params.query.tab;
  return t === "suggestions" ? "suggestions" : "inbox";
}

// Exclude-role settings that filter one of the message's referenced types, with the entity's value.
function exclusionCandidates(msg, defn, entitiesById, settingsValues) {
  var m = msg.data;
  var producer = ((defn && defn.producers) || []).filter(function (p) { return p.id === m.producer; })[0];
  if (!producer) return [];
  var excludes = (producer.settings || []).filter(function (s) { return s.role === "exclude"; }).map(function (s) { return s.name; });
  var out = [];
  (m.refs || []).forEach(function (ref) {
    var t = defn.types && defn.types[ref.type];
    var entity = entitiesById[ref.id];
    if (!t || !entity) return;
    (t.settingFilters || []).forEach(function (f) {
      if (f.producer !== m.producer || excludes.indexOf(f.setting) === -1) return;
      var value = (entity.display || {})[f.field];
      if (value === undefined || value === null || value === "") return;
      var list = (settingsValues || {})[f.setting] || [];
      var lower = String(value).toLowerCase();
      // A Role and its Company can carry the same value; offer each exclusion once.
      if (out.some(function (c) { return c.setting === f.setting && String(c.value).toLowerCase() === lower; })) return;
      out.push({
        setting: f.setting, value: value, refId: ref.id,
        already: list.some(function (v) { return String(v).toLowerCase() === lower; }),
      });
    });
  });
  return out;
}

function suppressedLines(runs, defn) {
  return (runs || []).slice().sort(inboxNewest("startedAt")).filter(function (r) {
    return r.data.inboxSuppressed > 0;
  }).map(function (r) {
    var d = r.data;
    var cap = (d.settingsUsed || {}).max_inbox_per_run;
    var label = d.producer;
    ((defn && defn.producers) || []).forEach(function (p) { if (p.id === d.producer) label = p.label || p.id; });
    return { runId: r.id, text: label + ": " + d.inboxSuppressed + " more matched, not sent" + (cap === undefined ? "" : " (cap " + cap + ")") };
  });
}

// One line for a gated message: how it travels, when it times out, how it ended.
function gateLine(gate) {
  if (!gate) return "";
  var line = "Gate by " + (gate.transport || "an unknown transport");
  if (gate.outcome) return line + ", " + (gate.status || "closed") + ": " + gate.outcome + ".";
  return line + (gate.timeoutHours ? ", times out after " + gate.timeoutHours + " hours." : ".");
}

// The mono line under a proposal. Without from or to (a fault in what the routine wrote) it is the setting alone.
function proposalDiff(p) {
  p = normalizeProposal(p);
  if (p.from === undefined || p.to === undefined) return String(p.setting);
  return p.setting + ": " + JSON.stringify(p.from) + " to " + JSON.stringify(p.to);
}

function inboxCard(ctx, m, st) {
  var d = m.data;
  var status = el("span", { class: "status", role: "status" });
  var defn = ctx.definition;
  var actions = [];
  var extra = el("div", { class: "actions" });

  if (st.viewer) {
    var isRead = st.read.has(m.id), isDone = st.done.has(m.id);
    actions.push(actionButton(ctx, isRead ? "Mark unread" : "Mark read", function () { return markViewer(ctx, "read", m.id, !isRead); }, { icon: isRead ? null : "check", status: status }));
    actions.push(actionButton(ctx, isDone ? "Not done" : "Done", function () { return markViewer(ctx, "done", m.id, !isDone); }, { icon: isDone ? null : "check", status: status }));
    actions.push(snoozeControl(ctx, m, st, status));
  }
  var firstRef = (d.refs || [])[0];
  if (firstRef) {
    var starred = !!(st.userstate[firstRef.id] || {}).star;
    actions.push(starToggle(ctx, d.title || shortLabel(firstRef.key || firstRef.id), starred, function () {
      var cur = Object.assign({}, st.userstate[firstRef.id] || {});
      cur.star = !starred;
      return save(ctx.store, ctx.viewer, "userstate/" + firstRef.id, cur);
    }, { status: status }));
  }

  if (d.kind === "proposal") {
    var p = d.proposal || {};
    var dec = st.decisions[m.id];
    if (dec) {
      actions.push(el("span", { class: "muted" }, decisionWord(dec) + " " + when(dec.at)));
    } else {
      // Dismiss counts as a rejection in the routine's memory; L2 and L3 changes are decided on Suggestions.
      actions.unshift(actionButton(ctx, "Dismiss", function () { return decide(ctx, m.id, "dismiss", p.key ? { key: p.key } : null); }, { icon: "x", status: status }));
      if (proposalLevel(p) === "L1") actions.unshift(actionButton(ctx, "Accept", function () { return acceptProposal(ctx, m); }, { primary: true, status: status, done: NEXT_RUN_NOTE }));
    }
  }

  if (d.gate) {
    var gate = st.pending[d.gate];
    var gdec = st.decisions[d.gate];
    var open = !gdec && (!gate || TODAY_OPEN_GATE.indexOf(gate.status) !== -1);
    if (gdec) actions.push(el("span", { class: "muted" }, (gdec.decision === "approve" ? "Approved" : "Rejected") + " " + when(gdec.at)));
    else if (!open) actions.push(el("span", { class: "muted" }, "Gate " + gate.status));
    else {
      actions.unshift(actionButton(ctx, "Reject", function () { return decide(ctx, d.gate, "reject"); }, { icon: "x", status: status }));
      actions.unshift(actionButton(ctx, "Approve", function () { return decide(ctx, d.gate, "approve"); }, { primary: true, status: status }));
    }
  }

  // Exclusion buttons need the referenced entities and the producer's settings; fetched per card.
  if ((d.kind === "match" || d.kind === "alert") && (d.refs || []).length) {
    Promise.all([ctx.store.get("settings/" + d.producer)].concat(d.refs.map(function (r) { return ctx.store.get("entities/" + r.id); })))
      .then(function (docs) {
        var settings = docs[0].exists ? (docs[0].data.values || {}) : {};
        var ents = {};
        docs.slice(1).forEach(function (doc) { if (doc.exists) ents[doc.id] = doc.data; });
        exclusionCandidates(m, defn, ents, settings).forEach(function (c) {
          append(extra, c.already
            ? el("span", { class: "muted" }, c.value + " is already in " + c.setting)
            : actionButton(ctx, "Add " + c.value + " to " + c.setting, function () {
              return addExclusion(ctx, d.producer, c.setting, c.value);
            }, { status: status, done: NEXT_RUN_NOTE }));
        });
      }, function () { /* the card still works without exclusion buttons */ });
  }

  var unread = st.viewer && !st.read.has(m.id) && !st.done.has(m.id);
  return el("li", { class: "item" + (unread ? " unread" : ""), "data-id": m.id },
    el("div", { class: "item-head" }, badge(d.kind), " ", d.title || "Untitled", unread ? el("span", { class: "visually-hidden" }, " (unread)") : null),
    d.why ? el("p", null, d.why) : null,
    d.kind === "proposal" && d.proposal && d.proposal.setting ? el("p", { class: "mono" }, proposalDiff(d.proposal)) : null,
    d.gate && st.pending[d.gate] ? el("p", { class: "muted" }, gateLine(st.pending[d.gate])) : null,
    d.gate ? el("p", { class: "muted" }, GATE_NOTE) : null,
    (d.refs || []).length ? el("p", { class: "refs" }, d.refs.map(function (r) { return el("a", { href: entityHash(r.id), title: String(r.key || r.id) }, shortLabel(r.key || r.id)); })) : null,
    el("p", { class: "fields muted" },
      el("span", null, producerLabel(defn, d.producer)), " ",
      el("time", { datetime: d.createdAt || null }, when(d.createdAt)), " ",
      d.run ? el("a", { href: "#/history/" + encodeURIComponent(d.run) }, "Run " + d.run) : null),
    el("div", { class: "actions" }, actions, status),
    extra);
}

// Snooze for 1, 3 or 7 days or until a date; a snoozed item offers Unsnooze.
function snoozeControl(ctx, m, st, status) {
  var until = st.snooze && st.snooze.get(m.id);
  var path = viewerPath(ctx.viewer, "snooze", m.id);
  if (until && until > new Date().toISOString()) {
    return actionButton(ctx, "Unsnooze", function () { return remove(ctx.store, ctx.viewer, path); }, { status: status });
  }
  var date = el("input", { type: "date", "aria-label": "Snooze until a date" });
  var box = el("details", { class: "snooze" }, el("summary", null, "Snooze"),
    el("div", { class: "actions" }, SNOOZE_CHOICES.map(function (c) {
      return actionButton(ctx, c[1], function () { return snoozeItem(ctx, m.id, snoozeUntil(c[0])); }, { status: status, done: "Snoozed." });
    }), date, actionButton(ctx, "Until date", function () {
      var u = snoozeUntil(date.value);
      if (!u) return Promise.reject(new Error("pick a date after today."));
      return snoozeItem(ctx, m.id, u);
    }, { status: status, done: "Snoozed." })));
  return box;
}

function snoozeMap(docs) {
  var out = new Map();
  (docs || []).forEach(function (d) { if (d.data && d.data.until) out.set(d.id, d.data.until); });
  return out;
}

// Tabs Inbox and Suggestions (#/inbox?tab=suggestions); the Suggestions tab is today's Suggestions page.
function renderInbox(outlet, ctx, params) {
  var tab = inboxTab(params);
  var tabs = el("div", { class: "tabs", role: "tablist", "aria-label": "Inbox" }, INBOX_TABS.map(function (t) {
    return el("a", { role: "tab", href: t[0] === "inbox" ? "#/inbox" : "#/inbox?tab=" + t[0], "aria-selected": String(tab === t[0]),
      class: tab === t[0] ? "tab active" : "tab" }, t[1]);
  }));
  if (tab === "suggestions") {
    append(outlet, tabs);
    return renderSuggestions(outlet, ctx, params);
  }
  var filter = "all";
  var last = null;
  var chips = el("div", { class: "chips", role: "group", "aria-label": "Show" });
  var lines = el("div");
  var list = el("ul", { class: "items" });
  var bulkStatus = el("span", { class: "status", role: "status" });
  var bar = el("div", { class: "actions" });
  append(outlet, el("div", { class: "page" }, el("h1", null, "Inbox"), tabs, chips, bar,
    ctx.viewer ? null : stateView("per-viewer-off"), lines, list));

  function draw() {
    clear(chips);
    INBOX_FILTERS.forEach(function (f) {
      var c = chip(f[1], { pressed: filter === f[0], onClick: function () { filter = f[0]; draw(); } });

/* src/pages/approvals.js: gates a run wrote to pending/<id>, waiting for a person (spec "Inbox, Suggestions,
